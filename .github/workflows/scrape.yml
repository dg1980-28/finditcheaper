name: Scrape Amazon
# The cloud sandbox cannot reach amazon.co.uk, so the morning run asks this workflow
# to read Movers & Shakers, the best seller lists and product pages from the runner
# and commit the result (video/research/scrape/<date>.json plus 600px images) back.
on:
  # Pushing video/research/scrape/request.json ({"asins": "...", "max_products": N})
  # starts a run too, because the GitHub App the sandbox uses cannot dispatch workflows.
  push:
    branches: [main]
    paths: ["video/research/scrape/request.json"]
  workflow_dispatch:
    inputs:
      asins:
        description: "Extra ASINs to read product pages for, space separated (existing products first)"
        required: false
        default: ""
      max_products:
        description: "How many product pages to read at most"
        required: false
        default: "60"
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pillow
      - name: Read Amazon
        run: |
          day=$(date -u +%F)
          asins="${{ github.event.inputs.asins }}"
          maxp="${{ github.event.inputs.max_products }}"
          if [ -z "$asins$maxp" ] && [ -f video/research/scrape/request.json ]; then
            asins=$(python3 -c "import json;print(json.load(open('video/research/scrape/request.json')).get('asins',''))")
            maxp=$(python3 -c "import json;print(json.load(open('video/research/scrape/request.json')).get('max_products',60))")
          fi
          python3 tools/scrape_amazon.py "video/research/scrape/$day.json" \
            --images "video/research/scrape/images" \
            --max-products "${maxp:-60}" \
            $asins
      - name: Commit the result
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add video/research/scrape
          git diff --cached --quiet || git commit -m "Scrape: Amazon lists and product pages $(date -u +%F)"
          git push
