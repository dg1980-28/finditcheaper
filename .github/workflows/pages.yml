name: Build and deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
  # A push made by the Render video workflow (GITHUB_TOKEN) does not trigger push
  # workflows, so redeploy when a render finishes to get the mp4 and image live.
  workflow_run:
    workflows: ["Render video"]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  check:
    # The cloud sandbox cannot reach the live site, so confirm the deploy from here.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the home page, the deals page and every product page
        run: |
          sleep 20
          for path in "" "deals.html" $(cd products && for d in */; do echo "products/$d"; done); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://finditcheaper.co.uk/$path")
            echo "https://finditcheaper.co.uk/$path -> $code"
            [ "$code" = "200" ] || exit 1
          done
